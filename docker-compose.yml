# Two services, one file. Everything that varies lives in .env.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # bind mount (not a named volume): all state can be backed up with tar
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    # Never root: uid/gid of the user that owns your media
    user: "${PUID}:${PGID}"
    # PERFMON: required by intel_gpu_top (dashboard GPU usage)
    cap_add:
      - PERFMON
    # Numeric GID of the HOST render group (the name doesn't exist in the container)
    group_add:
      - "${RENDER_GID}"
    devices:
      - "${DRI_DEVICE}:${DRI_DEVICE}"
    ports:
      - "${HTTP_PORT}:8080"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      HTTP_PORT: 8080
      MEDIA_ROOT: ${MEDIA_ROOT}
      SANDBOX_ROOT: ${SANDBOX_ROOT}
      DATA_DIR: /data
      DRY_RUN: ${DRY_RUN}
      TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS}
      DRI_DEVICE: ${DRI_DEVICE}
      RENDER_GID: ${RENDER_GID}
      PUID: ${PUID}
      PGID: ${PGID}
    volumes:
      # SAME absolute path on host and in container: paths stored in the DB
      # are valid on both sides, and new libraries never need a compose edit
      - ${MEDIA_ROOT}:${MEDIA_ROOT}
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/api/v1/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
